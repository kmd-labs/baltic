name: Deploy to GitHub Pages

# Deploys the commit as recorded in git, submodule pin included (0-01). Design-system updates
# arrive as their own commit on main, opened by sync-design-system.yml, so a push to main is the
# only signal that anything to deploy has changed — the six-hourly schedule and the
# design-system-updated dispatch that used to pick up submodule drift would now rebuild an
# identical tree.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with Design System submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Without it the build fails later on an unreadable SCSS import; fail here, where the cause
      # is legible. `git submodule update --remote` used to run instead, which built whatever
      # design-system main happened to be — a deploy that no commit in this repo describes.
      - name: Verify the Design System submodule is checked out
        run: |
          test -f src/design-system/_variables.scss \
            || { echo "::error::src/design-system is empty — checkout did not fetch the submodule"; exit 1; }
          git submodule status src/design-system

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ secrets.KMD_BOT_APP_ID }}
          private-key: ${{ secrets.KMD_BOT_PRIVATE_KEY }}

      - name: Configure GitHub Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Angular application for GitHub Pages
        run: npm run build:gh-pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/baltic/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
